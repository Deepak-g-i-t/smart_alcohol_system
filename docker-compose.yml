version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: alcohol_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smart_alcohol_system
      MYSQL_USER: alcohol_user
      MYSQL_PASSWORD: alcohol_password
    ports:
      - "3306:3306"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - mysql_data:/var/lib/mysql
    networks:
      - alcohol_network

  mongodb:
    image: mongo:6.0
    container_name: alcohol_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - alcohol_network

  backend:
    build: ./backend
    container_name: alcohol_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MYSQL_HOST=mysql
      - MYSQL_USER=alcohol_user
      - MYSQL_PASSWORD=alcohol_password
      - MYSQL_DB=smart_alcohol_system
      - MONGO_URI=mongodb://admin:adminpassword@mongodb:27017/alcohol_logs?authSource=admin
      - JWT_SECRET=supersecret_jwt_key_999
    depends_on:
      - mysql
      - mongodb
    networks:
      - alcohol_network

networks:
  alcohol_network:
    driver: bridge

volumes:
  mysql_data:
  mongo_data:
