worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" $status "$http_referer"';
    access_log /var/log/nginx/access.log main;

    sendfile       on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss image/svg+xml;

    # Rate limiting — generous limits to avoid false "Network Error" blocks
    limit_req_zone $binary_remote_addr zone=api:10m  rate=60r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=60r/m;

    upstream backend  { server backend:5000;  keepalive 32; }
    upstream frontend { server frontend:80; }

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options          "SAMEORIGIN"                  always;
        add_header X-Content-Type-Options   "nosniff"                     always;
        add_header X-XSS-Protection         "1; mode=block"               always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' ws: wss:;" always;

        # ── Health check endpoint — no rate limit ──────────────
        location = /api/health {
            proxy_pass http://backend;
            access_log off;
        }

        # ── API proxy — handles ALL /api/* including /api/auth/* ─
        # Single block avoids the location-specificity override bug.
        location /api/ {
            limit_req zone=api  burst=100 nodelay;
            limit_req zone=auth burst=60  nodelay;
            limit_req_status 429;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;
        }

        # ── Socket.io WebSocket ────────────────────────────────
        location /socket.io/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 86400s;
        }

        # ── Frontend SPA (must be last, catch-all) ─────────────
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;

            # SPA fallback — route all 404s to index.html
            proxy_intercept_errors on;
            error_page 404 = @spa_fallback;
        }

        location @spa_fallback {
            proxy_pass http://frontend;
        }
    }
}
